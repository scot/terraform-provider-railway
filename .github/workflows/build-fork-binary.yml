name: Build fork binary

on:
  push:
    branches: [add-environment-id-support]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install deps
        run: go mod download
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/terraform-provider-railway_v0.6.3-envid .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-provider-railway_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/terraform-provider-railway_v0.6.3-envid
